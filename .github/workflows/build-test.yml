name: '构建测试(不推送)'

on:
  workflow_dispatch:
    inputs:
      repoUrl:
        description: 'git仓库克隆url'
        required: true
      repoBranch:
        description: '分支'
        required: false
      platforms:
        description: '平台'
        required: false
        default: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@main

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Git clone
        run: |
          rm -rf {*,.[^.]*,..?*}
          if [[ "${{ github.event.inputs.repoBranch }}" ]] ;then
            git clone --depth 1 -b "${{ github.event.inputs.repoBranch }}" "${{ github.event.inputs.repoUrl }}" .
          else
            git clone --depth 1 "${{github.event.inputs.repoUrl}}" .
          fi
          ls -la
          test -f Dockerfile && echo "Dockerfile present"

      - name: Build image (no push)
        uses: docker/build-push-action@master
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms }}
          load: true
          tags: buildtest:local

      - name: Smoke test
        run: |
          cp config.example.json config.json
          sed -i 's#"listen_addr": "127.0.0.1:47833"#"listen_addr": "0.0.0.0:47833"#' config.json
          grep listen_addr config.json
          docker rm -f bt 2>/dev/null || true
          docker run -d --name bt -p 47833:47833 \
            -e API_KEYS=sk-smoke-test \
            -e LISTEN_ADDR=0.0.0.0:47833 \
            -v "$GITHUB_WORKSPACE/config.json:/app/config.json:ro" \
            buildtest:local
          sleep 10
          echo '=== container logs ==='
          docker logs bt 2>&1 | tail -40
          echo '=== healthz ==='
          curl -s -m 20 http://127.0.0.1:47833/healthz || true
          echo
          echo '=== /v1/models ==='
          curl -s -m 20 -H 'Authorization: Bearer sk-smoke-test' http://127.0.0.1:47833/v1/models || true
          echo
          echo '=== auth check (no key, expect 401) ==='
          curl -s -m 20 -o /dev/null -w '%{http_code}\n' http://127.0.0.1:47833/v1/models || true
          docker rm -f bt